name: Temporary Arc chain Alchemy test

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Test Alchemy support for Arc mainnet (chain 5042)
        run: |
          curl -s -w "\nHTTP_CODE=%{http_code}\n" \
            -G "https://www.dashhq.site/cron/test-alchemy" \
            --data-urlencode "address=0x0000000000000000000000000000000000dEaD" \
            --data-urlencode "chain=arc" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
