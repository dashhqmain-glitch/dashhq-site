name: _tmp-verify-prune-fix
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Re-check db size estimate
        run: |
          curl -sS --max-time 120 -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://www.dashhq.site/cron/db-size-estimate" | python3 -m json.tool
