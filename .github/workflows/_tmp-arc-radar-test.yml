name: Temporary Arc mint radar live check

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Test Alchemy Arc mainnet access again
        run: |
          curl -s -w "\nHTTP_CODE=%{http_code}\n" \
            -G "https://www.dashhq.site/cron/test-alchemy" \
            --data-urlencode "address=0x0000000000000000000000000000000000000000" \
            --data-urlencode "chain=arc" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
