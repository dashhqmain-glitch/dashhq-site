name: Temporary Arc mint radar live check

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Run a full nft-poll cycle and show the arc_mint_radar result
        run: |
          curl -s -w "\nHTTP_CODE=%{http_code}\n" \
            "https://www.dashhq.site/cron/nft-poll" \
            -H "Authorization: Bearer ${{ secrets.NFT_CRON_SECRET }}"
