name: Temporary ended-mint dry run

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Show the raw timestamp Ink vs Robinhood return, and whether it parses
        run: |
          curl -s -G "https://www.dashhq.site/cron/check-mint-status" \
            --data-urlencode "slugs=lunas-luminous-dream,useless-bankers" --data-urlencode "probe=true" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            | jq -c '.results[] | {slug, chain, sampled_mints, first: .query_probe.desc_1_meta}'
