name: Temporary ended-mint dry run

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Multi-chain verdicts on today's real tracked-wallet mints
        run: |
          for attempt in 1 2 3; do
            curl -s "https://www.dashhq.site/cron/recent-convergence-summary?hours=24&limit=500" \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" -o summary.json
            jq -e '.slugs' summary.json >/dev/null 2>&1 && break
            echo "summary attempt $attempt failed, retrying"; sleep 3
          done
          jq -r '[.slugs[].slug] | .[0:60] | .[]' summary.json > all_slugs.txt
          echo "candidate slugs: $(wc -l < all_slugs.txt)"
          for i in 1 2 3 4; do
            batch=$(sed -n "$(( (i-1)*15 + 1 )),$(( i*15 ))p" all_slugs.txt | paste -sd, -)
            [ -z "$batch" ] && continue
            curl -s -G "https://www.dashhq.site/cron/check-mint-status" --data-urlencode "slugs=$batch" \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              | jq -r '.results[] | [.slug, (.chain // "-"), ((.last_mint_age_seconds // -1) | floor | tostring), (.mints_last_10m | tostring), ((.total_supply // "-") | tostring), ((.max_supply // "-") | tostring), (.would_block | tostring), (.reason // .error // "")] | @tsv'
          done | sort -k2,2 -k7,7 | column -t -s $'\t'
      - name: Real poll cycle with the blocker live (must be HTTP 200)
        run: |
          curl -s -w "\nHTTP_CODE=%{http_code}\n" "https://www.dashhq.site/cron/nft-poll" \
            -H "Authorization: Bearer ${{ secrets.NFT_CRON_SECRET }}" | jq -Rr 'if startswith("{") then (fromjson | {took_seconds, errors, tracked_wallet_watch: (.tracked_wallet_watch | {checked, mints_found, posted}), nft_scope_posts, alert_tracker_recheck}) else . end'
