name: Temporary ended-mint dry run

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe why Ink reports no last-mint time
        run: |
          curl -s -G "https://www.dashhq.site/cron/check-mint-status" \
            --data-urlencode "slugs=lunas-luminous-dream" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" -o status.json
          echo "--- diagnostic row ---"; cat status.json; echo
          contract=$(jq -r '.results[0].contract' status.json)
          echo "--- check-collection-minters (asc, maxCount 1000, contractAddresses+fromAddress) on ink for $contract ---"
          curl -s -G "https://www.dashhq.site/cron/check-collection-minters" \
            --data-urlencode "contract=$contract" --data-urlencode "chain=ink" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" | head -c 900; echo
          echo "--- same check on robinhood for comparison (useless-bankers) ---"
          curl -s -G "https://www.dashhq.site/cron/check-mint-status" \
            --data-urlencode "slugs=useless-bankers" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" | head -c 700; echo
