name: Temporary embed redesign live check

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Show the real floor/mint-progress data cinder-tooth's post should have carried
        run: |
          curl -s -G "https://www.dashhq.site/cron/check-mint-status" \
            --data-urlencode "slugs=cinder-tooth" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" | jq .
          echo "--- collection floor/symbol from the same source the embed uses ---"
          curl -s "https://www.dashhq.site/toolkit/nft-collection?slug=cinder-tooth" | jq '{name, floor, floorUsd, symbol}'
