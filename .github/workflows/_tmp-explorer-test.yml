name: Temporary explorer reachability test

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test Ink Blockscout API
        run: |
          curl -s -o /dev/null -w "Ink Blockscout: HTTP %{http_code}\n" \
            "https://explorer.inkonchain.com/api/v2/addresses/0x5e84a4bba53d563438c1f4020f8d9d7d89499999/token-transfers?type=ERC-721,ERC-1155"

      - name: Test Robinhood Blockscout API
        run: |
          curl -s -o /dev/null -w "Robinhood Blockscout: HTTP %{http_code}\n" \
            "https://robinhoodchain.blockscout.com/api/v2/addresses/0x5e84a4bba53d563438c1f4020f8d9d7d89499999/token-transfers?type=ERC-721,ERC-1155"

      - name: Test Etherscan (no key, expect a rate-limit-style response not a block)
        run: |
          curl -s -o /dev/null -w "Etherscan: HTTP %{http_code}\n" \
            "https://api.etherscan.io/api?module=account&action=tokennfttx&address=0x5e84a4bba53d563438c1f4020f8d9d7d89499999&sort=desc"
