name: _tmp-db-size
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Query real Supabase size estimate
        run: |
          curl -sS -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://www.dashhq.site/cron/db-size-estimate" | python3 -m json.tool
