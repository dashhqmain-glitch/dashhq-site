name: Temporary X-link check

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm a real collection carries a twitter handle end to end
        run: |
          curl -s -G "https://www.dashhq.site/toolkit/nft-collection" \
            --data-urlencode "slug=pudgypenguins" \
            | jq '{name, twitter}'
