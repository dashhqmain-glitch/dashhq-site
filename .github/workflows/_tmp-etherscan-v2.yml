name: Temporary etherscan v2 check

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Get raw Etherscan V2 response
        run: |
          curl -s "https://api.etherscan.io/v2/api?chainid=1&module=account&action=tokennfttx&address=0x5e84a4bba53d563438c1f4020f8d9d7d89499999&sort=desc" | head -c 1000
