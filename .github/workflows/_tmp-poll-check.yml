name: Temporary post-deploy poll check

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: One real poll cycle, showing the cleanup results and any skips or errors
        run: |
          curl -s -w "\nHTTP_CODE=%{http_code}\n" "https://www.dashhq.site/cron/nft-poll" \
            -H "Authorization: Bearer ${{ secrets.NFT_CRON_SECRET }}" \
            | jq -Rr 'if startswith("{") then (fromjson | {took_seconds, skipped, errors, pruned_old_snapshots, pruned_old_sale_events, pruned_old_call_buyers, tracked_wallet_watch: (.tracked_wallet_watch | {checked, mints_found, posted}), alert_tracker_recheck}) else . end'
