    runs-on: ubuntu-latest
    steps:
      - name: Diagnose ponxz-miners-rigs
        run: |
          curl -s -w "\nHTTP_CODE=%{http_code}\n" \
            -G "https://www.dashhq.site/cron/diagnose-slug-posting" \
