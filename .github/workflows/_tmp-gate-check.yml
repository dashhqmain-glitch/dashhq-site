name: Temporary live-gate check

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Run the production gate wrapper on real ended and live mints
        run: |
          curl -s -G "https://www.dashhq.site/cron/check-mint-status" \
            --data-urlencode "slugs=ink-kittens,phantasmagoria-vessel,nftiecjmr,qft-quantum-echoes,demosthenes-976941098,smolboi-380681282" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            | jq -r '.results[] | [.slug, (.chain // "-"), ((.last_mint_age_seconds // -1) | floor | tostring), ("gate_passes=" + (.passes_live_gate | tostring)), (.reason // "")] | @tsv' | column -t -s $'\t'
