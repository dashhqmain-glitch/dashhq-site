name: Temporary raw alchemy check

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check wallet mints on Robinhood via Alchemy directly
        run: |
          curl -s -w "\nHTTP_CODE=%{http_code}\n" \
            -G "https://www.dashhq.site/cron/test-alchemy" \
            --data-urlencode "address=0x5e84a4bba53d563438c1f4020f8d9d7d89499999" \
            --data-urlencode "chain=robinhood" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
