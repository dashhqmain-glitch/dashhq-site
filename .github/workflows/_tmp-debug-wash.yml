name: _tmp-debug-wash
on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Query debug-wash-trading for rhsnakrs
        run: |
          curl -sS -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://www.dashhq.site/cron/debug-wash-trading?slug=rhsnakrs" | python3 -m json.tool
