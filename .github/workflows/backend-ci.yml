name: Backend CI

# Runs the Python backend's test suite on every change - this is what
# actually keeps deploys safe, not the deploy mechanism itself (Vercel's
# own atomic per-deployment cutover already means zero downtime as long
# as what gets shipped isn't broken). Catches a bug before it's live,
# instead of finding out from a broken Discord command.
#
# Manual rollback (no auto-rollback is wired up - see notify-on-failure
# below for why): `vercel rollback <deployment-url> --yes` from a machine
# with `vercel` CLI logged into this project, or promote any previous
# deployment to production from the Vercel dashboard's Deployments tab.
# Both take under a minute.

on:
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - 'api/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [master]
    paths:
      - 'backend/**'
      - 'api/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r api/requirements.txt
          pip install pytest pytest-asyncio

      - name: Compile-check every backend module
        run: python -m py_compile backend/main.py backend/config.py backend/register_commands.py backend/pnl_card.py

      - name: Full module import check
        working-directory: backend
        env:
          SUPABASE_URL: https://ci-placeholder.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
          DISCORD_BOT_TOKEN: ci-placeholder
          DISCORD_PUBLIC_KEY: ci-placeholder
          DISCORD_CLIENT_ID: ci-placeholder
          DISCORD_GUILD_ID: ci-placeholder
        run: python -c "import main; print('import OK')"

      - name: Run test suite
        working-directory: backend
        env:
          SUPABASE_URL: https://ci-placeholder.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
          DISCORD_BOT_TOKEN: ci-placeholder
          DISCORD_PUBLIC_KEY: ci-placeholder
          DISCORD_CLIENT_ID: ci-placeholder
          DISCORD_GUILD_ID: ci-placeholder
        run: pytest -v

  post-deploy-check:
    # Only after a real push to master (not PRs, which never reach
    # production) and only once the test job above has actually passed.
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Poll until THIS commit is actually the one live
        # /health returning 200 only ever proved SOME deployment was
        # responding - it's a static response, identical whether the
        # brand-new build landed or Vercel's auto-deploy silently never
        # fired and the site is still serving a build from hours/days
        # ago. Confirmed live: that exact blind spot let several pushes
        # in a row report CI success while production kept running stale
        # code the whole time. /health now echoes VERCEL_GIT_COMMIT_SHA
        # (Vercel injects it automatically, no extra secret needed) -
        # this polls until that value actually matches the commit this
        # workflow run is FOR, not just until something answers 200.
        run: |
          for i in $(seq 1 36); do
            response=$(curl -s "https://www.dashhq.site/health")
            live_commit=$(echo "$response" | grep -o '"commit":"[^"]*"' | cut -d'"' -f4)
            echo "attempt $i: live commit is ${live_commit:-<none>}, expecting ${{ github.sha }}"
            if [ "$live_commit" = "${{ github.sha }}" ]; then
              echo "Live and confirmed on the right commit."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Production is still not serving commit ${{ github.sha }} after 3 minutes - Vercel's auto-deploy for this push may not have fired. Check the Vercel dashboard's Deployments tab directly."
          exit 1

      - name: Live real-endpoint check
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" "https://www.dashhq.site/toolkit/nft-search?q=azuki")
          echo "NFT search check: HTTP $code"
          if [ "$code" -ge 500 ]; then
            echo "::error::A real endpoint is failing (HTTP $code) after a deploy."
            exit 1
          fi

      - name: Re-register Discord commands
        # Idempotent and cheap - safe to run after every deploy, so a
        # command-schema change never gets forgotten as a separate manual
        # step again. A 401 here specifically means CRON_SECRET has
        # drifted between Vercel's env and this repo's GitHub secret -
        # that's a real, fixable problem, so it fails the job instead of
        # just warning. Any other failure (a transient 5xx, etc.) warns
        # without blocking, since it's not something re-running fixes.
        run: |
          status=$(curl -s -o response.json -w "%{http_code}" \
            "https://www.dashhq.site/cron/register-discord-commands" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "Command registration: HTTP $status"
          cat response.json
          if [ "$status" = "401" ]; then
            echo "::error::CRON_SECRET in GitHub Actions no longer matches Vercel's copy - update the 'CRON_SECRET' repo secret to match the current Vercel value."
            exit 1
          elif [ "$status" -ge 400 ]; then
            echo "::warning::Command registration failed with HTTP $status - check manually."
          fi

  notify-on-failure:
    # Fires if either job above failed, on a real push to master only -
    # GitHub's default is a failure email to whoever pushed, easy to
    # miss. This posts straight into the ops alert channel instead. Does
    # NOT auto-rollback (see the note at the top of this file for why and
    # what the manual command is) - a human should look at what actually
    # broke before deciding whether reverting is even the right fix.
    #
    # Known blind spot: this uses the same CRON_SECRET as the endpoints
    # above, so a secret-drift failure (the one case the previous job
    # hard-fails on) also breaks this notification. GitHub's own red X
    # and failure email still fire regardless - that path isn't lost,
    # just the proactive Discord ping for that one specific failure mode.
    needs: [test, post-deploy-check]
    if: failure() && github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Post failure alert
        run: |
          curl -s -o /dev/null -w "notify: %{http_code}\n" \
            -G "https://www.dashhq.site/cron/notify" \
            --data-urlencode "level=error" \
            --data-urlencode "message=Backend CI failed on master after ${{ github.sha }} (${{ github.event.head_commit.message }}). Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
