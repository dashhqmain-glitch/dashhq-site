name: Temporary diagnose-slug-posting check

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose pistacio-nft
        run: |
          curl -s -w "\nHTTP_CODE=%{http_code}\n" \
            -G "https://www.dashhq.site/cron/diagnose-slug-posting" \
            --data-urlencode "slug=pistacio-nft" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - name: Check if the minting wallet is tracked
        run: |
          curl -s -w "\nHTTP_CODE=%{http_code}\n" \
            -G "https://www.dashhq.site/cron/check-tracked-wallets" \
            --data-urlencode "addresses=0x5E84a4bbA53D563438c1f4020f8D9d7d89499999" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
