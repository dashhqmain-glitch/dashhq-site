name: Temporary founding-charter backfill

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Backfill founding-charter mint events for tracked wallets
        run: |
          curl -s -w "\nHTTP_CODE=%{http_code}\n" \
            -G "https://www.dashhq.site/cron/backfill-collection-mints" \
            --data-urlencode "contract=0x69101f92427376fa80476a997d024cf9dc3eae39" \
            --data-urlencode "chain=robinhood" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
