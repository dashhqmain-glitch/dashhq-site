name: Temporary founding-charter diagnose

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose why founding-charter didn't post
        run: |
          curl -s -w "\nHTTP_CODE=%{http_code}\n" \
            -G "https://www.dashhq.site/cron/diagnose-slug-posting" \
            --data-urlencode "slug=founding-charter" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
