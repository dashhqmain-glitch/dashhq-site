name: Temporary fire real calls to see the grade

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Show aura-2222's real floor/mint data
        run: |
          curl -s -G "https://www.dashhq.site/cron/check-mint-status" --data-urlencode "slugs=aura-2222" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" | jq .
          curl -s "https://www.dashhq.site/toolkit/nft-collection?slug=aura-2222" | jq '{name, floor, floorUsd, symbol}'
