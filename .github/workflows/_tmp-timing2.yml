name: Temporary post-fix timing check

on:
  workflow_dispatch: {}

jobs:
  time-it:
    runs-on: ubuntu-latest
    steps:
      - name: Time a single /cron/nft-poll call, post chain-scoping fixes
        run: |
          curl -s -o response.json -w "\nHTTP_CODE=%{http_code}\nTIME_TOTAL=%{time_total}\n" \
            -X GET "https://www.dashhq.site/cron/nft-poll" \
            -H "Authorization: Bearer ${{ secrets.NFT_CRON_SECRET }}"
          echo "--- response body ---"
          cat response.json
