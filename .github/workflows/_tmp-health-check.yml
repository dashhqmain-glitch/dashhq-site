name: _tmp-health-check
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Poll heartbeat
        run: |
          curl -sS -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://www.dashhq.site/cron/check-poll-heartbeat" | python3 -m json.tool

      - name: Webhook status
        run: |
          curl -sS -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://www.dashhq.site/cron/check-webhook-status" | python3 -m json.tool

      - name: Wallet / Alert Tracker stats
        run: |
          curl -sS -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://www.dashhq.site/cron/wallet-stats" | python3 -m json.tool

      - name: Recent convergence summary
        run: |
          curl -sS -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://www.dashhq.site/cron/recent-convergence-summary" | python3 -m json.tool

      - name: Site health endpoint
        run: |
          curl -sS -w "\nHTTP %{http_code}\n" "https://www.dashhq.site/health"
